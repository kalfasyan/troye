version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    groups:
      go: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directories: [/, /workers]
    schedule: { interval: monthly }
  - package-ecosystem: uv
    directory: /workers
    schedule: { interval: weekly }
    groups:
      workers: { patterns: ['*'] }
