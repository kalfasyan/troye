# Runs the app, and optionally a worker, from the published images.
# Settings come from .env next to this file (see .env.example); deploy/install.sh
# sets everything up. Update with: docker compose pull && docker compose up -d

services:
  app:
    image: ${TROYE_IMAGE:-ghcr.io/kalfasyan/troye:latest}
    restart: unless-stopped
    # Run as the owner of ./pb_data, so the data folder stays yours (and a NAS user's).
    user: ${PUID:-1000}:${PGID:-1000}
    # Only this machine can reach the port. Use Tailscale or a reverse proxy for other devices.
    ports:
      - 127.0.0.1:${PORT:-8090}:8090
    volumes:
      - ./pb_data:/app/pb_data
    environment:
      TZ: ${TZ:-UTC}
      TROYE_PUSH_CONTACT: ${TROYE_PUSH_CONTACT:-}
    mem_limit: 512m

  # Runs one of the workers in workers/, TROYE_WORKER_SCRIPT (worker.py by default).
  # Enabled with COMPOSE_PROFILES=worker in .env.
  worker:
    image: ${TROYE_WORKER_IMAGE:-ghcr.io/kalfasyan/troye-worker:latest}
    command: [python, "${TROYE_WORKER_SCRIPT:-worker.py}"]
    profiles: [worker]
    restart: unless-stopped
    depends_on: [app]
    environment:
      TZ: ${TZ:-UTC}
      TROYE_URL: http://app:8090
      TROYE_WORKER: ${TROYE_WORKER:-}
      TROYE_WORKER_PASSWORD: ${TROYE_WORKER_PASSWORD:-}
    mem_limit: 256m
